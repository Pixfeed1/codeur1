<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#3B2417"/>
<title>Ravive — Contributeur (v26)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Caveat:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4ECDD;--paper2:#EFE4D2;--ink:#33261C;--muted:#9A8A76;--gold:#BC5A44;--gold-soft:#E2AF9C;--line:#E7DBC9;--choco:#3B2417;--blush:#F2DFD8;--heart:#BC5A44}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);background:#2A1910;display:flex;flex-direction:column;align-items:center;min-height:100%}
  .demobar{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 16px 5px;background:var(--choco)}
  .demobar .brand{font-family:'Fraunces',serif;color:#EADFC9;font-weight:400;font-size:15px}
  .demobar .brand small{font-family:'Nunito Sans';color:#B9A88C;font-weight:600;font-size:11px}
  .ghost{border:1px solid #5A4130;background:#4A3320;color:#E7D8C2;font:inherit;font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer}
  .stage{width:100%;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 12px 26px}
  .device{position:relative;width:392px;max-width:100%;height:min(848px,calc(100dvh - 84px));background:#000;border-radius:46px;padding:11px;box-shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 2px #241d15}
  .screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:60}
  .sbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:15px 26px 0;font-size:13px;font-weight:800;color:var(--ink);pointer-events:none}
  @media(max-width:460px){.demobar{position:sticky;top:0;z-index:100}.stage{padding:0}.device{border-radius:0;padding:0;height:calc(100dvh - 50px);width:100%;box-shadow:none}.screen{border-radius:0}.notch{display:none}}

  .scroll{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column}
  .view{position:absolute;inset:0;display:flex;flex-direction:column}
  .fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .head{padding:58px 26px 4px;position:relative}
  .backarr{position:absolute;top:50px;left:20px;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;text-align:center}
  .head h1{font-family:'Fraunces',serif;font-weight:400;font-size:25px;text-align:center;margin:8px 0 0;line-height:1.22}
  .body{padding:16px 26px 32px}
  .sub{color:var(--muted);font-weight:600;font-size:14px;line-height:1.55;text-align:center}
  .stack{display:flex;flex-direction:column;gap:11px;margin-top:20px}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;background:var(--choco);color:var(--paper);padding:15px 22px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;transition:.15s}
  .btn:active{transform:scale(.99)}
  .btn.gold{background:var(--choco);color:var(--paper)}
  .btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.keep{margin-top:16px;background:var(--vivid,var(--gold));color:#fff}
  .btn.pass2{background:var(--paper2);color:var(--ink);border:1.5px solid var(--line)}
  .btn.pass2 svg{opacity:.8}
  .arrow:after{content:"→";font-weight:700}
  .link{background:none;border:0;font:inherit;font-weight:800;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:center;width:100%;margin-top:18px}
  .link:after{content:" →"}
  .skip{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--blush);border:1px solid #EBD0C8;color:var(--gold);font-weight:800;font-size:12px;padding:6px 13px;border-radius:999px}
  .counter{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;font-size:12px}
  .pubimg{width:100%;border-radius:20px;display:block;box-shadow:0 22px 44px -24px rgba(60,40,20,.5)}

  .choice{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fff;cursor:pointer;display:flex;gap:13px;align-items:center;font-weight:800;font-size:15px;margin-bottom:11px;transition:.15s}
  .choice:active{transform:scale(.99)}.choice .em{font-size:22px}
  textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:15px;background:#fff;color:var(--ink);resize:none;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--gold-soft)}

  /* enregistrement doux (couleurs DA) */
  .recorder{background:var(--soft);border:1.5px solid transparent;border-radius:20px;padding:26px 20px;text-align:center}
  .mic{width:80px;height:80px;border-radius:50%;background:var(--vivid,var(--gold));color:#241d12;border:0;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;cursor:pointer;box-shadow:0 16px 30px -14px rgba(0,0,0,.35)}
  .mic svg{width:46px;height:46px;display:block}
  .mic.rec{background:var(--heart);color:#fff;animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(199,123,90,.45)}50%{box-shadow:0 0 0 15px rgba(199,123,90,0)}}
  .rectime{font-weight:800;font-size:18px}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:26px;margin:8px 0}
  .wave i{width:3px;background:var(--vivid,var(--gold-soft));border-radius:3px}
  .wave.on i{animation:eq .9s ease-in-out infinite}@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  /* lecteur après enregistrement */
  .player{display:flex;align-items:center;gap:14px;background:transparent;border:1.5px solid var(--vivid,var(--line));border-radius:16px;padding:12px 15px}
  .pbtn{width:42px;height:42px;border-radius:50%;background:transparent;color:var(--vivid);border:2px solid var(--vivid);font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .pt{font-weight:800;font-size:13px;color:var(--vivid);opacity:.85}
  .prow{display:flex;justify-content:center;margin-top:12px}
  .soft{background:none;border:0;color:var(--vivid,var(--ink));font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:6px 10px}

  .how{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
  .how .n{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:var(--blush);border:1px solid #EBD0C8;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px}
  .how .n svg{width:19px;height:19px;display:block}
  .note .em svg{width:16px;height:16px;display:inline-block;vertical-align:-2px}
  .heart{color:var(--heart)}.heart svg{width:15px;height:15px}
  .sig{font-family:'Caveat',cursive;color:var(--gold);text-align:center;font-size:21px;margin-top:22px;line-height:1}
  .how .tt{font-weight:800;font-size:13.5px}.how .dd{color:var(--muted);font-weight:600;font-size:12px;margin-top:1px;line-height:1.4}

  .drop{border:1.6px dashed var(--vivid,var(--gold));border-radius:18px;background:#fff;padding:34px 20px;text-align:center;cursor:pointer}
  .drop .ic{font-size:38px}.drop .ic.camsig{font-size:0}.drop .ic.camsig svg{width:58px;height:58px;display:block;margin:0 auto}.drop .tt{font-weight:800;font-size:15px;margin-top:8px}
  .prev{position:relative;border-radius:18px;overflow:hidden}.prev img{width:100%;display:block;max-height:300px;object-fit:cover}
  .prevphoto{width:216px;max-width:64%;aspect-ratio:9/16;margin:6px auto 0;border-radius:22px;overflow:hidden}
  .prevphoto img{width:100%;height:100%;max-height:none;object-fit:cover;display:block}
  .prevphoto .qpreview{position:absolute;left:12px;right:12px;z-index:3;color:#fff;font-family:'Fraunces',serif;font-weight:400;font-size:13px;line-height:1.26;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .prevphoto .qpreview.top{top:14px}.prevphoto .qpreview.bottom{bottom:16px}
  .prevphoto:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.36),transparent 30%,transparent 68%,rgba(0,0,0,.4))}
  .prev.prevphoto .re{bottom:auto;top:10px;right:10px;padding:6px 10px;font-size:11.5px}
  .prevcap{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:8px}
  .qposrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .qposrow .lbl{font-weight:700;font-size:12.5px;color:var(--muted)}
  .qpos{border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer}
  .qpos.on{border-color:var(--gold);background:var(--gold);color:#fff}
  .framer{margin:12px auto 0;max-width:216px}
  .framer .lbl{font-weight:700;font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:6px}
  .framer input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
  /* ---- constructeur multi-pièces ---- */
  .piece{background:var(--soft);border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:12px}
  .photocomp{margin-top:14px;text-align:center;background:var(--wash,var(--paper2));border:1px dashed var(--gold-soft);border-radius:16px;padding:16px 14px}
  .cropbox{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;background:#100c08;touch-action:none;cursor:grab;user-select:none}
  .cropbox img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);-webkit-user-drag:none;user-select:none;will-change:transform}
  .crophint{position:absolute;left:0;right:0;bottom:12px;z-index:3;text-align:center;color:#fff;font-weight:700;font-size:12.5px;text-shadow:0 1px 6px rgba(0,0,0,.75);pointer-events:none}
  .photocomp .pcq{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:12px}
  .photocomp .pcq span{color:var(--muted);font-weight:600;font-size:12px}
  .photocomp .btn.line{width:100%}
  .piece.ptext{align-items:flex-start}
  .piece .pi{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center}
  .piece .pi svg{width:38px;height:38px}
  .piece .pmid{flex:1;min-width:0}
  .piece .ptt{font-weight:800;font-size:15px;color:var(--ink)}
  .piece .pss{font-weight:600;font-size:12px;color:var(--ink);opacity:.6;margin-top:2px}
  .piece .ptxt{flex:1;min-width:0;font-family:'Fraunces',serif;font-size:15px;line-height:1.34;color:var(--ink)}
  .piece .pthumb{width:46px;height:60px;border-radius:10px;object-fit:cover;flex:0 0 auto}
  .piece .prm{background:none;border:0;color:var(--vivid);font:inherit;font-weight:800;font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 0;text-align:right}
  .miniplay{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:transparent;border:2px solid var(--vivid);color:var(--vivid);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
  .cdov{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:var(--soft);border-radius:20px;font-family:'Fraunces',serif;font-weight:300;font-size:88px;color:var(--vivid);z-index:5}
  .recorder{position:relative}
  /* ---- story composite (photo + texte + vocal) ---- */
  /* combiné : contenu à gauche, aperçu photo à droite, ouverture plein écran */
  .stmc-photo{position:absolute;right:0;top:0;bottom:0;width:42%;background-size:cover;z-index:5}
  .stmc-photo .fade{position:absolute;inset:0}
  .stmc-exp{position:absolute;right:12px;top:47%;transform:translateY(-50%);z-index:14;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:#3a2a20;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.55)}
  .stmc-exp svg{width:18px;height:18px}
  .stmc-lower{position:absolute;left:24px;right:22px;bottom:92px;z-index:8;display:flex;flex-direction:column;gap:13px;align-items:flex-start}
  .stmc-line{width:34px;height:1px;background:currentColor;opacity:.4}
  .stmc-text{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:16.5px;line-height:1.4;opacity:.94;max-width:74%;overflow-wrap:break-word}
  .stm-voice{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 15px 8px 8px;flex:0 0 auto}
  .stm-pl{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.85);border:0;color:#3a2a20;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stm-pl svg{width:14px;height:14px}
  .stm-wave{display:flex;align-items:center;gap:2.5px;height:24px}
  .stm-wave i{width:2.5px;border-radius:3px;background:currentColor;opacity:.85}
  .st-multi .stm-wave.on i{animation:eqm 1s ease-in-out infinite}
  @keyframes eqm{0%,100%{transform:scaleY(.42)}50%{transform:scaleY(1)}}
  .stm-t{font-weight:800;font-size:12px;opacity:.9}
  .stmc-full{position:absolute;inset:0;z-index:60;background:#1a120c;animation:fade .3s ease}
  .stmc-fullimg{position:absolute;inset:0;background-size:cover}
  .stmc-full .veilb{position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(18,12,8,.85))}
  .stmc-back{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:#3a2a20;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .stmc-back svg{width:18px;height:18px}
  .stmc-fulltext{position:absolute;left:26px;right:26px;bottom:78px;z-index:4;color:#fff;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:18px;line-height:1.42;text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .st-multi.has-photo .maq,.st-multi.has-photo .makick{text-align:left;left:26px;right:46%}
  /* Vocal + photo : halo centre transparent sur la photo */
  .halowrap.vp{top:47%}
  .vp-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:26;width:70px;height:70px;border-radius:50%;background:rgba(28,20,14,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1.5px solid rgba(255,255,255,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .vp-play svg{width:22px;height:22px}
  .vpbar{position:absolute;left:40px;right:40px;bottom:96px;z-index:30;display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .vpbar .track{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);position:relative}
  .vpbar .track>i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:#fff;width:6%}
  .st-vp .mfoot,.st-vp .mheartf,.st-vp .mphoto-q{color:#fff}
  .vpbar2{position:absolute;left:24px;right:24px;bottom:96px;z-index:34;display:flex;align-items:center;gap:11px;color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .vp-mini{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:rgba(20,14,10,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1.5px solid rgba(255,255,255,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .vp-mini svg{width:14px;height:14px}
  .vpbar2 .track{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);position:relative}
  .vpbar2 .track>i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:#fff;width:6%}
  .st-vp .maq2,.st-vp .mphoto-q .makick{text-shadow:0 1px 12px rgba(0,0,0,.6)}
  /* Écrit + photo : bouton « Lire son message » + panneau qui remonte */
  .st-tp .mphoto-q,.st-tp .mfoot{color:#fff}
  .st-tp .maq2,.st-tp .mphoto-q .makick{text-shadow:0 1px 12px rgba(0,0,0,.6)}
  .tp-open{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:34;display:inline-flex;align-items:center;gap:8px;background:var(--choco);color:var(--paper);border:0;font:inherit;font-weight:800;font-size:13.5px;padding:11px 18px;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.6);transition:opacity .3s}
  .tp-open svg{width:16px;height:16px}.tp-open .tparr{font-size:14px}
  .tp-panel{position:absolute;left:0;right:0;bottom:0;z-index:44;background:var(--paper);border-radius:24px 24px 0 0;padding:26px 26px 30px;text-align:center;transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);box-shadow:0 -14px 40px -20px rgba(0,0,0,.5)}
  .tp-panel.open{transform:translateY(0)}
  .tp-panel .tp-q{display:block;font-family:'Fraunces',serif;font-size:44px;line-height:.4;color:var(--gold);opacity:.7}
  .tp-panel .tp-text{font-family:'Fraunces',serif;font-size:17px;line-height:1.44;color:var(--ink);margin:6px 4px 0;overflow-wrap:break-word}
  .tp-panel .tp-heart{margin-top:14px;color:var(--heart)}.tp-panel .tp-heart svg{width:18px;height:18px}
  .tp-panel .tp-close{margin-top:18px;width:100%;background:var(--choco);color:var(--paper)}
  .prev .re{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:0;font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
  .note{background:var(--blush);border:1px solid #EBD0C8;border-radius:14px;padding:12px 14px;font-weight:600;font-size:12.5px;line-height:1.45;display:flex;gap:9px;align-items:flex-start;margin-top:14px}.note .em{font-size:15px}
  .field label{display:block;font-weight:800;font-size:12.5px;margin-bottom:8px}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--gold-soft)}
  .rchips{display:flex;flex-wrap:wrap;gap:9px}
  .rchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:800;font-size:13.5px;cursor:pointer;transition:.15s}
  .rchip.on{border-color:var(--gold);background:var(--gold);color:#fff}

  /* catégories + questions en cartes cliquables */
  .cat{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;cursor:pointer;transition:.15s}
  .cat:active{transform:scale(.99)}.cat .ic{font-size:24px}.cat .t{font-weight:800;font-size:15px}.cat .ar{margin-left:auto;color:var(--gold);font-weight:800}
  .qcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 16px;margin-bottom:11px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.15s}
  .qcard:active{transform:scale(.99)}
  .qcard .qt{flex:1;font-family:'Fraunces',serif;font-weight:400;font-size:16.5px;line-height:1.32}
  .qcard .ar{color:var(--gold);font-weight:800;flex:0 0 auto}
  .qcard.done{opacity:.55;cursor:default;background:var(--paper2)}
  .qcard .tag{font-family:'Nunito Sans';font-weight:800;font-size:11px;color:var(--gold);flex:0 0 auto}
  .qbox{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-family:'Fraunces',serif;font-size:17px;line-height:1.35;margin-bottom:16px}
  .selfiewrap{text-align:center;margin:2px 0 20px}

const SC={};
function bars(){const h=[8,15,22,12,25,17,10,23,14,19,8,17,24,12,20,10,16,22,14,9,20,12];return h.map(x=>`<i style="height:${x}px"></i>`).join("");}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,'0');}
function pubMosaic(){const T=[["#C9A98A","#9C7A55"],["#B9A48C","#8A7256"],["#CBB196","#A07E5B"],["#B79C86","#877055"],["#C4A87F","#987a4c"],["#BFAE93","#8f7a5a"]];let o="";for(let i=0;i<24;i++){const g=T[i%6];o+=`<span style="background:linear-gradient(145deg,${g[0]},${g[1]})"></span>`}return o;}

/* ---- zone de réponse (vocal / écrit) ---- */
function answerArea(ctx){const st=ctx==='free'?S.free:S.q;
  if(st.mode==='choice'){
    return `<div class="opts">
      ${opt('lead',SIG_MIC,'Lui parler','Enregistrer un message vocal',"setMode('"+ctx+"','audio')")}
      ${opt('',SIG_PEN,'Lui écrire','Quelques mots suffisent',"setMode('"+ctx+"','texte')")}
    </div>`;
  }
  if(st.mode==='audio'){
    if(st.audio>0){
      return `<div class="player">
          <button class="pbtn" id="pbtn-${ctx}" onclick="playTog('${ctx}')">▶</button>
          <div class="wave">${bars()}</div>
          <div class="pt" id="pt-${ctx}">${fmt(st.audio)}</div>
          ${st.audioURL?`<audio id="aud-${ctx}" src="${st.audioURL}" preload="auto"></audio>`:''}
        </div>
        <div class="prow"><button class="soft" onclick="resetAudio('${ctx}')">↻ Je recommence</button></div>
        <button class="btn keep" onclick="keep('${ctx}')">Ça me va</button>`;
    }
    return `<div class="recorder"><button class="mic" id="mic" onclick="micTog('${ctx}')">${SIG_MIC_ON}</button><div class="wave">${bars()}</div><div class="rectime" id="rt">0:00</div><div class="sub" id="rechelp" style="margin-top:6px">Appuie pour parler, appuie encore pour arrêter</div></div>`;
  }
  if(st.mode==='photo'){
    if(st.photo){const pos=st.qpos==='bottom'?'bottom':'top';const f=st.photoFoc==null?50:st.photoFoc;return `<div class="prev prevphoto"><img id="qImg" src="${st.photo}" style="object-position:50% ${f}%">
         <div class="qpreview ${pos}">${gq((S.editing&&S.editQ)?S.editQ.q:(S.cur?S.cur.q:''))}</div>
         <button class="re" onclick="clearQPhoto()">Changer</button></div>
       <div class="prevcap">Aperçu du cadrage réel dans la story</div>
       <div class="framer"><div class="lbl">Glisse pour cadrer</div><input type="range" min="0" max="100" value="${f}" oninput="frameQ('${ctx}',this.value)"></div>
       <div class="qposrow"><span class="lbl">Placer la question :</span>
         <button class="qpos ${pos==='top'?'on':''}" onclick="setQpos('${ctx}','top')">En haut</button>
         <button class="qpos ${pos==='bottom'?'on':''}" onclick="setQpos('${ctx}','bottom')">En bas</button></div>
       <button class="btn keep" onclick="keep('${ctx}')">Ça me va</button>`;}
    return `<div class="drop" onclick="pickQPhoto()"><div class="ic camsig">${SIG_CAM}</div><div class="tt">Choisir une photo</div><div class="sub" style="margin-top:4px">Celle qui répond le mieux</div></div>`;
  }
  return `<textarea placeholder="Écris ce que tu ressens…" oninput="setText('${ctx}',this.value)">${st.text}</textarea>
     <button class="btn keep" onclick="keep('${ctx}')">Ça me va</button>`;
}
function setMode(ctx,m){(ctx==='free'?S.free:S.q).mode=m;render();}
function setQpos(ctx,pos){(ctx==='free'?S.free:S.q).qpos=pos;render();}
function frameMain(v){S.photoFoc=+v;const im=document.getElementById('mainImg');if(im)im.style.objectPosition='50% '+v+'%';}
function frameQ(ctx,v){(ctx==='free'?S.free:S.q).photoFoc=+v;const im=document.getElementById('qImg');if(im)im.style.objectPosition='50% '+v+'%';}
/* ---- constructeur : plusieurs pièces par souvenir ---- */
function hasAny(st){return st.audio>0||((st.text||'').trim())||!!st.photo;}
function addPiece(ctx,type){(ctx==='free'?S.free:S.q).mode=type;render();}
function commitPiece(ctx){(ctx==='free'?S.free:S.q).mode='choice';render();}
function cancelPiece(ctx){(ctx==='free'?S.free:S.q).mode='choice';render();}
function removePiece(ctx,type){const st=ctx==='free'?S.free:S.q;
  if(type==='audio'){if(st.audioURL&&st.audioURL.indexOf('blob:')===0){try{URL.revokeObjectURL(st.audioURL);}catch(e){}}st.audioURL=null;st.audio=0;}
  else if(type==='texte'){st.text='';}
  else if(type==='photo'){st.photo=null;}
  render();}
function pieceMiniPlay(ctx){const st=ctx==='free'?S.free:S.q;
  return `<div class="piece"><button class="miniplay" id="pbtn-${ctx}" onclick="playTog('${ctx}')">▶</button>
     <div class="pmid"><div class="ptt">Vocal</div><div class="pss" id="pt-${ctx}">${fmt(st.audio)}</div></div>
     <button class="prm" onclick="removePiece('${ctx}','audio')">Supprimer</button>
     ${st.audioURL?`<audio id="aud-${ctx}" src="${st.audioURL}" preload="auto"></audio>`:''}</div>`;}
function pieceText(ctx){const st=ctx==='free'?S.free:S.q;const t=(st.text||'').trim();
  return `<div class="piece ptext"><span class="pi">${SIG_PEN}</span><div class="ptxt">${esc(t.length>90?t.slice(0,90)+'…':t)}</div>
     <div style="display:flex;flex-direction:column;gap:3px"><button class="prm" onclick="addPiece('${ctx}','texte')">Modifier</button><button class="prm" onclick="removePiece('${ctx}','texte')">Supprimer</button></div></div>`;}
function piecePhoto(ctx){const st=ctx==='free'?S.free:S.q;const f=st.photoFoc==null?50:st.photoFoc;
  return `<div class="piece"><img class="pthumb" src="${st.photo}" style="object-position:50% ${f}%"><div class="pmid"><div class="ptt">Photo</div><div class="pss">En complément</div></div>
     <div style="display:flex;flex-direction:column;gap:3px"><button class="prm" onclick="addPiece('${ctx}','photo')">Modifier</button><button class="prm" onclick="removePiece('${ctx}','photo')">Retirer</button></div></div>
     <div class="txtcol"><span class="tcl">Texte sur la photo</span><div class="tcbs"><button class="tcb ${!st.overlayDark?'on':''}" onclick="setOverlay('${ctx}',false)">Clair</button><button class="tcb ${st.overlayDark?'on':''}" onclick="setOverlay('${ctx}',true)">Foncé</button></div></div>`;}
function setOverlay(ctx,dark){(ctx==='free'?S.free:S.q).overlayDark=dark;render();}
function photoComplement(ctx){const st=ctx==='free'?S.free:S.q;
  if(st.photo)return piecePhoto(ctx);
  return `<div class="photocomp"><div class="pcq">Une photo pour accompagner ce souvenir ? <span>· facultatif</span></div><button class="btn line" onclick="addPiece('${ctx}','photo')">Ajouter une photo</button></div>`;}
function builderRows(ctx){const st=ctx==='free'?S.free:S.q;
  const hA=st.audio>0, hT=(st.text||'').trim();
  if(!hA&&!hT){
    return `<div class="opts">
      ${opt('lead',SIG_MIC,'Le raconter','Enregistrer un vocal',"addPiece('"+ctx+"','audio')")}
      ${opt('',SIG_PEN,"L'écrire",'Quelques mots',"addPiece('"+ctx+"','texte')")}
    </div>${(ctx==='q'&&!S.editing)?`<div class="opts" style="margin-top:11px">${opt('alt',IC_REF,'Une autre question','Passer à une autre',"passer()")}</div>`:''}`;
  }
  let h= hA?pieceMiniPlay(ctx):pieceText(ctx);

  h+=`<div class="stack" style="margin-top:16px"><button class="btn keep" onclick="keep('${ctx}')">Valider ce souvenir</button></div>`;
  return h;}
function curQ(ctx){if(ctx==='free')return 'Ton mot pour '+P;return gq((S.editing&&S.editQ)?S.editQ.q:(S.cur?S.cur.q:''));}

function countThenRec(ctx){const ov=document.getElementById('cdov'),help=document.getElementById('rechelp');if(!ov)return;

function rotatePhoto(ctx){const st=ctx==='free'?S.free:S.q;if(!st.photo)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.height;c.height=img.width;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(img,-img.width/2,-img.height/2);try{st.photo=c.toDataURL('image/jpeg',0.9);}catch(e){}render();};img.src=st.photo;}

function micTog(ctx){const mic=document.getElementById('mic');if(!mic)return;
  if(mic.classList.contains('rec')){stopRec(ctx);return;}

function startRec(ctx){const st=ctx==='free'?S.free:S.q;const mic=document.getElementById('mic'),rt=document.getElementById('rt'),help=document.getElementById('rechelp');
  if(!mic)return; mic.classList.add('rec');
  const wave=mic.parentElement.querySelector('.wave'); if(wave)wave.classList.add('on');
  if(help)help.textContent='Parle-lui comme si elle était devant toi.';
  recS=0; if(rt)rt.textContent='0:00'; recChunks=[]; mediaRec=null;
  recInt=setInterval(()=>{recS++;if(rt)rt.textContent=fmt(recS);if(recS>=90)stopRec(ctx);},1000);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      if(!mic.classList.contains('rec')){stream.getTracks().forEach(t=>t.stop());return;}
      recStream=stream; try{mediaRec=new MediaRecorder(stream);}catch(e){mediaRec=null;}
      if(mediaRec){mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
        mediaRec.onstop=()=>finishRec(ctx,st); recT0=performance.now(); mediaRec.start();}
    }).catch(()=>{});
  }}
function stopRec(ctx){const st=ctx==='free'?S.free:S.q;if(recInt){clearInterval(recInt);recInt=null;}
  if(mediaRec&&mediaRec.state&&mediaRec.state!=='inactive'){mediaRec.stop();}
  else{cleanupStream();useDemo(st);st.mode='choice';render();}}
function finishRec(ctx,st){let ok=false;
  try{if(recChunks.length){const blob=new Blob(recChunks,{type:(mediaRec&&mediaRec.mimeType)||'audio/webm'});if(blob.size>200){if(st.audioURL&&st.audioURL!==DEMO_AUDIO)URL.revokeObjectURL(st.audioURL);st.audioURL=URL.createObjectURL(blob);ok=true;}}}catch(e){}
  if(ok){const dur=Math.round((performance.now()-recT0)/1000);st.audio=Math.max(1,dur||recS||2);}
  else{useDemo(st);}
  cleanupStream();mediaRec=null;st.mode='choice';render();}
function playTog(ctx){const st=ctx==='free'?S.free:S.q;const btn=document.getElementById('pbtn-'+ctx),wave=btn?btn.parentElement.querySelector('.wave'):null,pt=document.getElementById('pt-'+ctx),aud=document.getElementById('aud-'+ctx);
  if(aud&&st.audioURL){
    if(aud.paused){aud.currentTime=0;aud.play().catch(()=>{});if(btn)btn.textContent='❚❚';if(wave)wave.classList.add('on');
      aud.ontimeupdate=()=>{if(pt)pt.textContent=fmt(Math.min(st.audio,Math.ceil(aud.currentTime)))+' / '+fmt(st.audio);};
      aud.onended=()=>{if(btn)btn.textContent='▶';if(wave)wave.classList.remove('on');if(pt)pt.textContent=fmt(st.audio);};
    }else{aud.pause();if(btn)btn.textContent='▶';if(wave)wave.classList.remove('on');}
    return;}

  playSim=setInterval(()=>{s++;if(pt)pt.textContent=fmt(Math.min(dur,s))+' / '+fmt(dur);if(s>=dur){clearInterval(playSim);if(btn)btn.textContent='▶';if(wave)wave.classList.remove('on');if(pt)pt.textContent=fmt(dur);}},1000);}

  S.answered.push(rec);

}

    <div class="body">
      <div class="selfiewrap">
        <div class="selfie" onclick="pickSelfie()">${S.selfie?`<img src="${S.selfie}">`:'<span class="cam">📷</span>'}</div>
        <div class="sfl">${S.selfie?'Me reprendre':'À toi de jouer 📷'}</div>
        <div class="sub" style="margin-top:5px">Ton plus beau sourire… ou ta pire grimace.</div>
      </div>

/* ---- 2. PHOTO ---- */
SC.photo=()=>{
  const has=!!S.photo;
  const inner=has?`<div class="cropbox" id="cropbox"><img id="cropimg" src="${S.photo}" draggable="false"><div class="crophint">Déplace et zoome la photo pour choisir le cadrage</div></div>`
   :`<div class="drop" onclick="pick()"><div class="ic">🖼️</div><div class="tt">Ajouter ma photo</div></div>`;
  app.innerHTML=`<div class="scroll fade"><div class="head"><button class="backarr" onclick="go('moi')">‹</button><span class="kicker">Une photo</span><h1>Choisis une photo qui<br>raconte quelque chose<br>de vous</h1></div>
    <div class="body">
      <div class="sub" style="margin:-2px 0 18px">Un souvenir, un fou rire, un voyage, un moment complètement banal… choisis celle que tu aimerais qu'${gEl()} garde.</div>
      ${inner}
      ${has?`<div class="stack" style="margin-top:16px"><button class="btn line" onclick="rotateHolder('cadre')">↻ Pivoter</button><button class="btn gold" onclick="commitCrop('cadre',function(){go('libre')})">Ça me va</button></div>
        <div style="text-align:center;margin-top:10px"><button class="skip" onclick="pick()">Choisir une autre photo</button></div>`:''}
      <div class="note"><span class="em">🖼️</span><span>Ta photo rejoindra celles de ses proches pour composer son <b>cadre</b> — l'objet qu'${gEl()} gardera chez ${gLui()}.</span></div>
      ${has?'':`<div class="stack"><button class="btn" onclick="go('libre')">Continuer <span class="arrow"></span></button></div><div style="text-align:center;margin-top:12px"><button class="skip" onclick="go('libre')">Plus tard</button></div>`}
    </div></div>`;
  if(has)initCropper('cadre');};
let cropSt=null;
function holderOf(k){return k==='cadre'?S:(k==='free'?S.free:S.q);}
function initCropper(k){const box=document.getElementById('cropbox'),img=document.getElementById('cropimg');if(!box||!img)return;const st=holderOf(k);
  function apply(){if(!cropSt)return;img.style.transform='translate(-50%,-50%) translate('+cropSt.x+'px,'+cropSt.y+'px) scale('+cropSt.scale+')';st.cropScale=cropSt.scale;st.cropX=cropSt.x;st.cropY=cropSt.y;}
  function setup(){const BW=box.clientWidth||300,BH=box.clientHeight||BW,iw=img.naturalWidth,ih=img.naturalHeight;if(!iw)return;const fit=Math.max(BW/iw,BH/ih);img.style.width=(iw*fit)+'px';img.style.height=(ih*fit)+'px';cropSt={BW,BH,iw,ih,fit,scale:st.cropScale||1,x:st.cropX||0,y:st.cropY||0};apply();}
  if(img.complete&&img.naturalWidth)setup();else img.onload=setup;
  let start=null,pinch=null,md=null;
  box.ontouchstart=e=>{if(!cropSt)return;if(e.touches.length===1){start={x:e.touches[0].clientX-cropSt.x,y:e.touches[0].clientY-cropSt.y};pinch=null;}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinch={d:Math.hypot(dx,dy),s:cropSt.scale};start=null;}};
  box.ontouchmove=e=>{if(!cropSt)return;e.preventDefault();if(pinch&&e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;cropSt.scale=Math.max(1,Math.min(4,pinch.s*Math.hypot(dx,dy)/pinch.d));apply();}else if(start&&e.touches.length===1){cropSt.x=e.touches[0].clientX-start.x;cropSt.y=e.touches[0].clientY-start.y;apply();}};
  box.ontouchend=e=>{if(e.touches.length===0){start=null;pinch=null;}};
  box.onmousedown=e=>{if(!cropSt)return;md={x:e.clientX-cropSt.x,y:e.clientY-cropSt.y};e.preventDefault();};
  window.onmousemove=e=>{if(md&&cropSt){cropSt.x=e.clientX-md.x;cropSt.y=e.clientY-md.y;apply();}};
  window.onmouseup=()=>{md=null;};
  box.onwheel=e=>{if(!cropSt)return;e.preventDefault();cropSt.scale=Math.max(1,Math.min(4,cropSt.scale*(e.deltaY<0?1.08:0.93)));apply();};}
function commitCrop(k,done){const img=document.getElementById('cropimg'),st=holderOf(k);if(!img||!cropSt){done();return;}
  const c=cropSt,total=c.fit*c.scale,swS=c.BW/total,shS=c.BH/total;
  let sx=c.iw/2-c.x/total-swS/2, sy=c.ih/2-c.y/total-shS/2;sx=Math.max(0,Math.min(c.iw-swS,sx));sy=Math.max(0,Math.min(c.ih-shS,sy));
  const outH=1200,outW=Math.max(1,Math.round(outH*c.BW/c.BH)),cv=document.createElement('canvas');cv.width=outW;cv.height=outH;const g=cv.getContext('2d');g.imageSmoothingQuality='high';
  try{g.drawImage(img,sx,sy,swS,shS,0,0,outW,outH);st.photo=cv.toDataURL('image/jpeg',0.9);}catch(e){}
  st.cropScale=1;st.cropX=0;st.cropY=0;cropSt=null;done();}
function rotateHolder(k){const st=holderOf(k);if(!st.photo)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.height;c.height=img.width;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(img,-img.width/2,-img.height/2);try{st.photo=c.toDataURL('image/jpeg',0.9);}catch(e){}st.cropScale=1;st.cropX=0;st.cropY=0;render();};img.src=st.photo;}
function pick(){fp.click();}
function readResized(file,cb,max){max=max||1400;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(img,0,0,cw,ch);try{cb(cv.toDataURL('image/jpeg',0.88));}catch(e){cb(r.result);}};img.onerror=()=>cb(r.result);img.src=r.result;};r.readAsDataURL(file);}
fp.onchange=e=>{const f=e.target.files[0];if(!f)return;readResized(f,d=>{S.photo=d;S.cropScale=1;S.cropX=0;S.cropY=0;fp.value="";render();});};
const fps=document.getElementById('fps');function pickSelfie(){fps.click();}
fps.onchange=e=>{const f=e.target.files[0];if(!f)return;readResized(f,d=>{S.selfie=d;fps.value="";render();},760);};
const fpq=document.getElementById('fpq');let qphCtx='q';
function pickQPhoto(ctx){qphCtx=ctx||'q';fpq.click();}
function clearQPhoto(ctx){(ctx==='free'?S.free:S.q).photo=null;render();}
fpq.onchange=e=>{const f=e.target.files[0];if(!f)return;const st=qphCtx==='free'?S.free:S.q;readResized(f,d=>{st.photo=d;st.cropScale=1;st.cropX=0;st.cropY=0;fpq.value="";render();});};

/* ---- 3. MOT LIBRE ---- */
SC.libre=()=>{const st=S.free;const th=theme('__libre');const sub=st.mode;const editing=(sub==='audio'||sub==='texte'||sub==='photo');
  const mid= editing?qPieceView('free'):builderRows('free');
  app.innerHTML=`<div class="scroll fade" style="${themeVars(th)}"><div class="head"><button class="backarr" onclick="${editing?`cancelPiece('free')`:`go('photo')`}">‹</button><span class="kicker" style="color:var(--vivid)">Ton message</span><h1>Ton mot libre<br>pour ${P}</h1></div>
    <div class="body">
      ${editing?'':`<div class="sub" style="margin-bottom:16px">Raconte ou écris ce que tu veux — tu pourras y ajouter une photo.</div>`}
      ${mid}
      ${editing?'':`<div style="text-align:center;margin-top:14px"><button class="link" onclick="go('qcard')">Ou découvre les questions</button></div>`}
    </div></div>`;
  if(sub==='audio'&&!(st.audio>0))countThenRec('free');if(sub==='photo'&&st.photo)initCropper('free');};

SC.libre_after=()=>{
  app.innerHTML=`<div class="view fade"><div class="body" style="padding-top:60px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center">
     <div style="font-size:40px">💌</div>
     <h1 style="font-family:'Fraunces',serif;font-weight:400;font-size:25px;margin-top:12px">Ton mot est bien là.</h1>
     <div style="font-family:'Fraunces',serif;font-weight:400;font-size:18px;margin-top:22px">Envie d'aller un peu plus loin ?</div>

      const inner=ringR;const len=rlen[i]*0.5+2+a*30+osc*(3+a*8);
      const x1=cx+Math.cos(ang)*inner,y1=cy+Math.sin(ang)*inner,x2=cx+Math.cos(ang)*(inner+len),y2=cy+Math.sin(ang)*(inner+len);
      const ln=rays[i];ln.setAttribute('x1',x1.toFixed(1));ln.setAttribute('y1',y1.toFixed(1));ln.setAttribute('x2',x2.toFixed(1));ln.setAttribute('y2',y2.toFixed(1));
      ln.setAttribute('stroke-opacity',(0.22+a*0.62*(0.45+osc*0.55)).toFixed(3));}
    if(core){core.style.transform='scale('+(0.7+a*0.9).toFixed(3)+')';core.style.opacity=(0.35+a*0.5).toFixed(3);}
    if(amb){amb.style.opacity=(0.22+a*0.5).toFixed(3);amb.style.transform=`scale(${(0.85+a*0.35).toFixed(3)})`;}
    if(timeEl)timeEl.textContent=fmt(Math.ceil(ct));
    if(track)track.style.width=Math.max(4,Math.min(100,(ct/dur)*100)).toFixed(0)+'%';
    haloRAF=requestAnimationFrame(frame);}
  haloRAF=requestAnimationFrame(frame);}
function playMine(i){stopHalo();const ps=pieces();if(!ps.length){go('review');return;}
  const p=ps[i];const sp=spal(p.t);
  const bars=ps.map((_,k)=>`<div class="p"><i style="width:${k<=i?'100%':'0'}"></i></div>`).join("");
  const av=S.selfie?`background-image:url('${S.selfie}')`:'background:var(--gold);color:#fff';
  const head=`<div class="mshead"><div class="mava" style="${av}">${S.selfie?'':(S.name?S.name[0]:'?')}</div><div class="mhinfo"><span class="n2">${S.name||'Toi'}</span><span class="s2">pour ${P}</span></div><button class="mx" onclick="stopHalo();go('review')">${ICON_X}</button></div>`;
  const nav=`<div class="mtaps"><div class="l" onclick="minePrev()"></div><div class="r" onclick="mineNext()"></div></div>`;
  const foot=`<div class="mfoot">Des souvenirs qui restent</div><div class="mheartf">${IC_HEART_O}</div>`;
  const hasA=p.audio>0,hasT=!!(p.text||'').trim(),hasP=!!p.photo;
  const cnt=(hasA?1:0)+(hasT?1:0)+(hasP?1:0);
  let cls,bgStyle,mid,colorStyle='',isHalo=false;
  const foc=p.photoFoc==null?50:p.photoFoc;
  const DOCICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>';
  if(hasA&&hasP){
    isHalo=true;cls='st-vp'+(p.overlayDark?' odark':'');bgStyle=`background-image:url('${p.photo}');background-position:50% ${foc}%`;
    mid=`<div class="mveil-top"></div><div class="mveil-bot"></div>
      <div class="mphoto-q top"><div class="makick">Un souvenir pour ${P}</div><div class="maq2">${p.q}</div></div>
      <div class="vpbar2"><button class="vp-mini" id="mpauseBtn" onclick="toggleHaloPause()">${ICON_PAUSE}</button><span id="mct">0:00</span><span class="track"><i id="mtrack"></i></span><span>${fmt(p.audio)}</span></div>
      ${foot}
      <audio id="mstoryAudio" src="${p.audioURL||DEMO_AUDIO}" preload="auto"></audio>`;
  }else if(hasT&&hasP){
    cls='st-tp'+(p.overlayDark?' odark':'');bgStyle=`background-image:url('${p.photo}');background-position:50% ${foc}%`;
    mid=`<div class="mveil-top"></div>
      <div class="mphoto-q top"><div class="makick">Un mot pour ${P}</div><div class="maq2">${p.q}</div></div>
      <button class="tp-open" id="tpopen" onclick="tpToggle()">${DOCICON}<span>Lire son message</span><span class="tparr">↑</span></button>
      <div class="tp-panel" id="tppanel"><span class="tp-q">“</span><div class="tp-text">« ${esc(p.text)} »</div><div class="tp-heart">${IC_HEART_O}</div><button class="btn tp-close" onclick="tpToggle()">Fermer</button></div>
      <div class="mfoot" style="color:#fff">Des souvenirs qui restent</div>`;
  }else if(hasA){
    isHalo=true;cls='st-audio';bgStyle=`background:${sp.bg}`;colorStyle=`color:${sp.ink}`;
    mid=`<div class="makick">Ton mot pour ${P}</div><div class="maq">${p.q}</div>
      <div class="halowrap"><div class="haloamb" id="haloAmb" style="background:radial-gradient(circle,${rgba(sp.acc,.5)},transparent 62%)"></div>
        <svg class="halo" viewBox="0 0 200 200" style="filter:drop-shadow(0 0 6px ${rgba(sp.acc,.55)})"><defs><radialGradient id="coreG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${sp.acc}" stop-opacity="0.55"/><stop offset="72%" stop-color="${sp.acc}" stop-opacity="0"/></radialGradient></defs>
          <circle id="haloCore" cx="100" cy="100" r="46" fill="url(#coreG)"></circle><g id="haloRays" stroke="${sp.acc}" stroke-linecap="round"></g></svg></div>
      <button class="mpause" id="mpauseBtn" onclick="toggleHaloPause()">${ICON_PAUSE}</button>
      <div class="mbar"><span class="ic">${ICON_SPK}</span><span id="mct">0:00</span><span class="track"><i id="mtrack"></i></span><span>${fmt(p.audio)}</span><span class="dots">•••</span></div>
      ${foot}
      <audio id="mstoryAudio" src="${p.audioURL||DEMO_AUDIO}" preload="auto"></audio>`;
  }else if(hasP){
    cls='st-photo';bgStyle=`background-image:url('${p.photo}');background-position:50% ${foc}%`;
    mid=`<div class="mveil-top"></div><div class="mveil-bot"></div>
      <div class="mphoto-q top"><div class="makick">Ton souvenir en image</div><div class="maq2">${p.q}</div></div>${foot}`;
  }else{
    cls='st-text';bgStyle=`background:${sp.bg}`;colorStyle=`color:${sp.ink}`;
    const len=(p.text||'').trim().length,size=len<14?52:len<40?40:len<110?27:len<220?23:len<340?20:len<480?18:len<650?16:15;
    mid=`<div class="mblobs"><span style="background:${rgba(sp.acc,.14)}"></span><span style="background:${rgba(sp.acc,.10)}"></span></div>
      <div class="makick">Ton mot pour ${P}</div><div class="maq">${p.q}</div>
      <div class="mtextwrap ${len>300?'longtxt':''}"><span class="mq1" style="color:${sp.acc}">“</span>
        <div class="mtextbody" style="font-size:${size}px">${esc(p.text)}</div>
        <span class="mq2" style="color:${sp.acc}">”</span>
        <div class="mtheart">${IC_HEART_O}</div></div>
      <div class="mfoot">Des souvenirs qui restent</div>`;
  }
  app.innerHTML=`<div class="mstory ${cls}" style="${bgStyle};${colorStyle}"><div class="mbg" style="${bgStyle}"></div>
     ${mid}
     <div class="mprog">${bars}</div>
     ${head}
     ${nav}
  </div>`;
  if(isHalo)startHalo(p,sp);
}
function tpToggle(){const pn=document.getElementById('tppanel'),op=document.getElementById('tpopen');if(!pn)return;const open=pn.classList.toggle('open');if(op)op.style.opacity=open?'0':'1';}
function mExpand(){const f=document.getElementById('mfull');if(f)f.style.display='block';}
function mCollapse(){const f=document.getElementById('mfull');if(f)f.style.display='none';}
function mineNext(){const ps=pieces();if(S.mpi<ps.length-1){S.mpi++;playMine(S.mpi);}else go('review');}
function minePrev(){if(S.mpi>0){S.mpi--;playMine(S.mpi);}}

SC.review=()=>{const ps=pieces();
  const rows=ps.map(p=>{const hA=p.audio>0,hT=!!(p.text||'').trim(),hP=!!p.photo;
    const icon=(hP?'📸':'')+(hA?'🎙️':'')+(hT?'✍️':'')||'✍️';
    const parts=[];if(hP)parts.push('Photo');if(hA)parts.push('Vocal · '+fmt(p.audio));if(hT)parts.push('« '+(p.text||'').slice(0,54)+((p.text||'').length>54?'…':'')+' »');
    const prev=parts.join(' · ');
    const st=S.starId===p.id;
    return `<div class="ritem ${st?'star':''}">
       <div class="ritop"><div class="rmain"><div class="rq">${icon} ${p.q}</div><div class="rp">${prev}</div></div>
         <button class="rstar ${st?'on':''}" onclick="starP('${p.id}')" title="Vu en premier">★</button></div>
       <div class="ractions"><button class="ract" onclick="editP('${p.id}')">Modifier</button><button class="ract del" onclick="delP('${p.id}')">Supprimer</button></div>
     </div>`;}).join("");
  app.innerHTML=`<div class="scroll fade"><div class="head"><button class="backarr" onclick="go('preview')">‹</button><span class="kicker">Avant d'envoyer</span><h1>Ton souvenir<br>pour ${P}</h1></div>
    <div class="body">
      <div class="note"><span class="em" style="color:var(--gold)">${IC_STAR}</span><span>Mets une <b style="color:var(--gold)">★</b> sur celui qui compte le plus — c'est celui que ${P} verra en premier.</span></div>
      ${ps.length?rows:'<div class="sub" style="margin:18px 0">Tu n\'as encore rien laissé.</div>'}
      ${!S.photo?`<div class="note" style="margin-top:14px"><span class="em">🖼️</span><span>Tu n'as pas encore ajouté de photo pour le cadre. <a onclick="go('photo')" style="color:var(--gold);font-weight:800;text-decoration:underline;cursor:pointer">Ajouter une photo</a></span></div>`:''}
      ${!S.free.done?`<div style="text-align:center;margin-top:16px"><button class="skip" onclick="go('libre')">Écrire un mot libre</button></div>`:''}
      <div class="stack" style="margin-top:14px"><button class="btn gold" onclick="go('merci')">✓ Valider et envoyer</button></div>
      <div style="text-align:center;margin-top:12px"><button class="skip" onclick="S.mpi=0;S.openSig=true;go('mstory')">Revoir en story</button></div>
      <div class="sig">Chaque souvenir compte <span class="heart">${IC_HEART}</span></div>
    </div></div>`;};
function starP(id){S.starId=(S.starId===id?null:id);render();}
function delP(id){if(id==='free'){S.free={mode:'choice',text:'',audio:0,playing:false,done:false};}else{S.answered.splice(+id.slice(1),1);}if(S.starId===id)S.starId=null;render();}
function editP(id){if(id==='free'){S.editing='free';go('libre');return;}const i=+id.slice(1),p=S.answered[i];S.editing='a'+i;S.editQ={q:p.q,ic:p.ic,t:p.t};S.cur=p;S.q={mode:'choice',text:p.text||'',audio:p.audio||0,audioURL:p.audioURL||null,photo:p.photo||null,qpos:p.qpos||'top',photoFoc:(p.photoFoc==null?50:p.photoFoc),overlayDark:p.overlayDark,cropScale:1,cropX:0,cropY:0,playing:false};go('qedit');}
SC.qedit=()=>{const q=S.editQ;const th=theme(q.t);const sub=S.q.mode;const editing=(sub==='audio'||sub==='texte'||sub==='photo');
  const mid=editing?qPieceView('q'):builderRows('q');
  app.innerHTML=`<div class="scroll fade" style="${themeVars(th)}"><div class="head"><button class="backarr" onclick="${editing?`cancelPiece('q')`:`S.editing=null;go('review')`}">‹</button><span class="kicker" style="color:var(--vivid)">${q.t}</span><h1 style="height:0;margin:0;visibility:hidden"></h1></div>
    <div class="body" style="padding-top:8px"><div class="qbox" style="background:var(--soft);border-color:transparent">${gq(q.q)}</div>${mid}</div></div>`;
  if(sub==='audio'&&!(S.q.audio>0))countThenRec('q');if(sub==='photo'&&S.q.photo)initCropper('q');
  if(sub==='photo'&&S.q.photo)initCropper('q');};

function restart(){reset();render();}
document.getElementById('restart').onclick=restart;
render();
</script>
