<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ravive — Livre d'or vivant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Caveat:wght@500;600&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECDD; --paper-2:#EFE4D2; --ink:#33261C; --muted:#9A8A76; --line:#E7DBC9;
    --gold:#BC5A44; --gold-soft:#E2AF9C; --heart:#BC5A44; --choco:#3B2417; --blush:#F2DFD8;
    --dark-text:#F4E7D8; --dark-mut:#B9A88C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);
    background:#2A1910;display:flex;flex-direction:column;align-items:center;min-height:100%}
  .demobar{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:13px 16px 5px;background:var(--choco)}
  .demobar .brand{font-family:'Fraunces',serif;color:#EADFC9;font-weight:400;font-size:15px;letter-spacing:.5px}
  .demobar .brand small{font-family:'Nunito Sans';color:#B9A88C;font-weight:600;font-size:11px}
  .seg{display:inline-flex;background:#4A3320;border:1px solid #5A4130;border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-weight:600;font-size:12.5px;color:#C9B79E;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.18s}
  .seg button.on{background:var(--gold);color:#fff}
  .ghost{border:1px solid #5A4130;background:#4A3320;color:#E7D8C2;font:inherit;font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer}

  .stage{width:100%;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 12px 26px}
  .device{position:relative;width:392px;max-width:100%;height:min(848px,calc(100dvh - 92px));background:#000;border-radius:46px;padding:11px;box-shadow:0 30px 70px -30px rgba(0,0,0,.8),0 0 0 2px #241d15}
  .screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:60}
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:15px 26px 0;font-size:13px;font-weight:700;color:var(--ink);pointer-events:none}
  .statusbar.light{color:var(--dark-text)}
  @media (max-width:460px){
    .demobar{position:sticky;top:0;z-index:100}
    .stage{padding:0}
    .device{border-radius:0;padding:0;height:calc(100dvh - 50px);width:100%;box-shadow:none}
    .screen{border-radius:0}.notch{display:none}
  }

  .view{position:absolute;inset:0;display:flex;flex-direction:column}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:66px 34px 46px}
  .fade{animation:fade .6s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ——— Entrée « suspens » / découverte (1er écran + compteur) ——— */
  @keyframes rvRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes rvSoft{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes dawnLift{0%{opacity:1}55%{opacity:.4}100%{opacity:0}}
  @keyframes glowBreath{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
  .rv{opacity:0;animation:rvRise 1.3s cubic-bezier(.2,.65,.2,1) both}
  .rv-soft{opacity:0;animation:rvSoft 1.15s cubic-bezier(.2,.65,.2,1) both}
  .dawn{position:absolute;inset:0;z-index:8;pointer-events:none;
        background:radial-gradient(120% 95% at 50% 42%, rgba(26,19,13,.82), #100b07);
        animation:dawnLift 2.9s ease forwards}
  .glow.breath{animation:glowBreath 2.4s ease both}
  @media (prefers-reduced-motion:reduce){
    .rv,.rv-soft{animation:none;opacity:1}
    .dawn{display:none}
    .glow.breath{animation:none}
  }

  /* écrans clairs : lueur douce */
  .glow{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%, #FBF4E7 0%, var(--paper) 55%);z-index:0}
  .wm{font-family:'Fraunces',serif;font-weight:400;font-size:22px;letter-spacing:.6px;color:var(--muted)}
  .orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:26px 0 20px}
  .orn i{display:block;width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i.r{background:linear-gradient(90deg,var(--gold),transparent)}
  .orn span{font-size:9px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:35px;line-height:1.18;color:var(--ink);letter-spacing:.1px}
  h1 em{font-style:italic;font-weight:400}
  .big{font-size:48px;line-height:1.08}
  .sub{color:var(--muted);font-weight:500;font-size:15px;margin-top:16px;line-height:1.55;max-width:30ch}
  .heart{color:var(--heart)}
  .count{font-family:'Fraunces',serif;font-weight:300;font-size:96px;line-height:1;color:var(--ink)}

  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;letter-spacing:.2px;
    background:var(--choco);color:var(--paper);padding:16px 34px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;transition:.18s}
  .btn:active{transform:scale(.97)}
  .btn.gold{background:var(--choco);color:var(--paper)}
  .btn.line{background:transparent;color:var(--ink);border:1.4px solid var(--line)}
  .btn.linedark{background:transparent;color:var(--dark-text);border:1.4px solid rgba(255,255,255,.24)}
  .btn .a:after{content:"→"}
  .stack{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:34px}

  /* ---- Reveal (sombre, plein écran) ---- */
  .story{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#4A3524,#2A1E14)}
  .story .ph{position:absolute;inset:0}
  .story .ph .g{position:absolute;inset:0}
  .story .ph .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:300;font-size:210px;color:rgba(255,255,255,.10)}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.6) 0%,rgba(20,14,10,.05) 26%,rgba(20,14,10,.1) 52%,rgba(20,14,10,.9) 100%)}
  .prog{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:5px;z-index:40}
  .prog .p{flex:1;height:2.5px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
  .prog .p>i{display:block;height:100%;width:0;background:var(--gold-soft);border-radius:3px}
  .shead{position:absolute;top:34px;left:18px;right:18px;z-index:40;display:flex;align-items:center;gap:11px}
  .ava{width:34px;height:34px;border-radius:50%;flex:0 0 auto;border:1.5px solid rgba(255,255,255,.75)}
  .shead .nm{color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .shead .x{margin-left:auto;color:#fff;opacity:.85;font-size:20px;font-weight:300;cursor:pointer}

  .sbody{position:absolute;left:30px;right:30px;bottom:44px;z-index:30}
  .kick{font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--gold-soft);opacity:.9;margin-bottom:14px}
  .qz{font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:22px;color:rgba(255,255,255,.9);line-height:1.35;margin-bottom:16px}
  /* voix */
  .voice{display:flex;align-items:center;gap:14px}
  .voice .pl{width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, rgba(216,190,140,.20), rgba(255,255,255,.05));
    border:1.5px solid rgba(216,190,140,.7);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.6), inset 0 0 12px rgba(216,190,140,.15)}
  .voice .pl svg{margin-left:2px}
  .wave{flex:1;display:flex;align-items:center;gap:3px;height:36px}
  .wave i{flex:1;border-radius:99px;min-width:2.5px;
    background:linear-gradient(180deg,var(--gold-soft),rgba(216,190,140,.35))}
  .wave.on i{animation:eq 1.1s ease-in-out infinite}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .voice .t{color:#fff;font-weight:700;font-size:13px;opacity:.9}
  /* mot écrit */
  .note{font-family:'Fraunces',serif;font-weight:300;font-size:28px;line-height:1.38;color:#fff}
  .note .quote{font-size:44px;color:var(--gold-soft);line-height:0;display:block;height:22px;opacity:.8}
  .sig{font-family:'Caveat',cursive;font-weight:600;font-size:26px;color:var(--gold-soft);margin-top:18px}

  .taps{position:absolute;inset:0;z-index:20;display:flex}
  .taps .l{width:32%}.taps .r{flex:1}

  /* ---- Livre d'or (bibliothèque) ---- */
  .lib{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
  .libhead{padding:62px 30px 6px;text-align:center}
  .libhead .t{font-family:'Fraunces',serif;font-weight:300;font-size:25px}
  .libhead .s{color:var(--muted);font-weight:500;font-size:13px;margin-top:6px}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px;padding:26px 24px 40px}
  .person{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
  .person .ava2{width:76px;height:76px;border-radius:50%;box-shadow:0 10px 22px -12px rgba(60,40,20,.5);position:relative;overflow:hidden}
  .person .ava2 .dot{position:absolute;right:3px;bottom:3px;width:17px;height:17px;border-radius:50%;background:var(--gold);border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px}
  .person .pn{font-weight:600;font-size:12.5px;color:var(--ink)}
  .backb{position:absolute;top:34px;left:18px;z-index:40;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:20px;cursor:pointer}
  .lib .backb{background:#fff;color:var(--ink);box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
  .logo-big{font-family:'Fraunces',serif;font-weight:400;font-size:46px;letter-spacing:.5px;line-height:.9;color:var(--ink)}
  .logo-tl{font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:12px}
  .hand-tl{font-family:'Caveat',cursive;font-weight:600;font-size:20px;color:#8a6f4a;margin-top:24px;line-height:1.18}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.wave.on i{animation:none}}
.person .ava2 .more{position:absolute;left:3px;top:3px;background:var(--gold);color:#fff;border:2px solid var(--paper);border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;padding:0 3px}
  .pbanner{position:relative;height:172px;display:flex;align-items:flex-end;flex:0 0 auto}
  .pbanner .pveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,12,.05),rgba(30,20,12,.62))}
  .pbanner .pname{position:relative;z-index:2;font-family:'Fraunces',serif;font-weight:400;font-size:30px;color:#fff;padding:0 26px 18px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .pscroll{flex:1;overflow:auto;padding:22px 24px 42px}
  .pcount{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:16px}
  .acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px 17px;margin-bottom:13px;box-shadow:0 10px 26px -18px rgba(60,40,20,.4)}
  .aq{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:11px}
  .arow{display:flex;align-items:center;gap:12px}
  .apl{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mwave{flex:1;display:flex;align-items:center;gap:2.5px;height:24px}
  .mwave i{flex:1;background:var(--gold-soft);border-radius:3px;min-width:2px}
  .adur{font-size:12px;font-weight:700;color:var(--muted)}
  .atext{font-family:'Fraunces',serif;font-weight:300;font-size:18px;line-height:1.42;color:var(--ink)}
  .shead .ava{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .ava2 .pinit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:400;font-size:30px;color:#fff}
  .photocap{color:rgba(255,255,255,.9);font-weight:700;font-size:14px;margin-top:8px}
  .pstorybody{position:absolute;left:26px;right:26px;top:92px;bottom:30px;z-index:30;overflow:auto;display:flex;flex-direction:column;justify-content:flex-end}
  .pstorybody.top{justify-content:flex-start;padding-top:6px}
  .pstorybody .bigtext{font-family:'Fraunces',serif;font-weight:300;font-size:22px;line-height:1.46;color:#fff}
  .pstorybody .bigtext .sig{margin-top:16px;font-family:'Caveat',cursive;font-size:22px;color:var(--gold-soft)}
  .pnav{position:absolute;bottom:0;left:0;right:0;height:64px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
  .pnav button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .pnav .pfin{background:var(--gold);color:#fff}
  .pnav .pdot{color:rgba(255,255,255,.85);font-weight:800;font-size:13px}
  .ptaps{position:absolute;inset:64px 0 0 0;z-index:34;pointer-events:none}
  .ptaps .pl,.ptaps .pr{position:absolute;top:0;bottom:0;width:30%;pointer-events:auto;cursor:pointer}
  .ptaps .pl{left:0}
  .ptaps .pr{right:0}
  .skipst{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border:0;font:inherit;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer}

  /* ——— Expérience « vivante » ——— */
  .motes{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .motes i{position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(216,190,140,.5),rgba(216,190,140,0));
    animation:drift linear infinite}
  @keyframes drift{0%{opacity:0;transform:translateY(10px) scale(.7)}
    18%{opacity:.5}82%{opacity:.4}100%{opacity:0;transform:translateY(-72px) scale(1.15)}}
  .heart.beat{display:inline-block;animation:beat 2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.16)}20%{transform:scale(1)}
    30%{transform:scale(1.1)}42%{transform:scale(1)}}
  .countwrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:200px}
  .countwrap .count{position:relative;z-index:3}
  .halo{position:absolute;inset:0;z-index:1;pointer-events:none}
  .halo .h{position:absolute;opacity:0;transform:scale(.5);
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
  .halo .h.show{opacity:.9;transform:scale(1)}
  .halo .hf{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;color:#fff;border:2px solid rgba(245,238,225,.55);
    box-shadow:0 10px 20px -12px rgba(60,40,20,.55);animation:floaty 5.5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .story .ph .g{animation:kenburns 7s ease-out both}
  @keyframes kenburns{from{transform:scale(1.005)}to{transform:scale(1.12)}}
  .story .ph .mono{animation:monoFloat 10s ease-in-out infinite}
  @keyframes monoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .btn.gold{position:relative;overflow:hidden}
  .btn.gold::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.30),transparent);
    transform:skewX(-18deg);animation:sheen 6.5s ease-in-out infinite;animation-delay:1.4s}
  @keyframes sheen{0%{left:-60%}20%{left:135%}100%{left:135%}}
  /* ——— Écran d'ouverture : compte à rebours + accueil sobre ——— */
  .scanview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 50% 40%,#4A3524,#241a12);text-align:center}
  .scan-wm{position:absolute;top:60px;left:0;right:0;font-family:'Fraunces',serif;font-size:18px;letter-spacing:.6px;color:var(--gold-soft);opacity:.72}
  .scan-n{height:180px;display:flex;align-items:center;justify-content:center}
  .scan-num{font-family:'Fraunces',serif;font-weight:300;font-size:150px;line-height:1;color:var(--dark-text);display:inline-block;animation:countPop .78s ease both}
  @keyframes countPop{0%{opacity:0;transform:scale(1.4)}22%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.82)}}
  .scan-hint{position:absolute;bottom:74px;left:0;right:0;color:var(--dark-mut);font-weight:500;font-size:13px;letter-spacing:.02em}
  .top-wm{position:absolute;top:60px;left:0;right:0;z-index:2;text-align:center;font-family:'Fraunces',serif;font-weight:400;font-size:22px;letter-spacing:.6px;color:var(--gold)}
  .quote-lead{font-family:'Fraunces',serif;font-weight:300;font-style:italic;font-size:31px;line-height:1.34;color:var(--ink);max-width:15ch;margin:0 auto}
  .quote-lead .qm{color:var(--gold-soft);font-style:normal}
  .soft-in{animation:softIn .55s ease both}
  @keyframes softIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .motes,.btn.gold::after{display:none}
    .heart.beat,.halo .hf,.story .ph .g,.story .ph .mono,.scan-num,.soft-in{animation:none}
    .halo .h{transition:none;opacity:.9;transform:none}
  }
  /* ===== stories façon contributeur : soleil vocal / texte / photo ===== */
  .story.st-audio,.story.st-text{color:var(--ink)}
  .story.st-photo{color:#fff}
  .story .prog .p>i{background:currentColor;opacity:.95}
  .story.st-photo .prog .p{background:rgba(255,255,255,.32)}
  .story.st-audio .prog .p,.story.st-text .prog .p{background:rgba(150,150,150,.32)}
  .shead .nm{color:inherit;text-shadow:none}
  .story.st-photo .shead .nm{text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .shead .x{color:inherit}
  .makick{position:absolute;left:26px;right:26px;top:86px;z-index:30;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;opacity:.72;color:inherit}
  .maq{position:absolute;left:30px;right:30px;top:108px;z-index:30;text-align:center;font-family:'Fraunces',serif;font-weight:400;font-size:23px;line-height:1.3;color:inherit}
  .halowrap{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
  .haloamb{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;filter:blur(44px)}
  .halo2{width:82%;max-width:340px;aspect-ratio:1;overflow:visible}
  .halo2 #haloCore{transform-box:fill-box;transform-origin:center}
  .mpause{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:34;width:52px;height:52px;border-radius:50%;background:transparent;border:1.5px solid currentColor;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mpause svg{width:15px;height:15px}
  .mbar{position:absolute;left:24px;right:24px;bottom:98px;z-index:34;display:flex;align-items:center;gap:9px;font-weight:800;font-size:11px;color:inherit}
  .mbar .ic{opacity:.85;display:flex}.mbar .ic svg{width:15px;height:15px}
  .mbar .track{flex:1;height:3px;border-radius:3px;background:currentColor;opacity:.3;position:relative}
  .mbar .track>i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:currentColor;width:14%}
  .mbar .dots{letter-spacing:1px;opacity:.7}
  .mfoot{position:absolute;left:0;right:0;bottom:52px;z-index:30;text-align:center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;opacity:.5;color:inherit}

 {n:0,selfie:true,type:"vocal",dur:"0:22",q:"Ce que je ne t'ai jamais dit…",more:[{type:"texte",q:"Ce que tu m'as appris",text:"À oser dire les choses, sans avoir peur. Merci pour ça.",sig:"Clara"},{type:"vocal",q:"Notre fou rire",dur:"0:16"},{type:"texte",q:"Ce que je voulais te dire depuis longtemps",text:"J'ai longtemps hésité à te le dire, alors je profite de ce moment. Tu es la première personne qui m'a fait sentir que je pouvais être moi, sans jamais me justifier. Tu te souviens de ce soir d'hiver où tout allait de travers ? Tu es restée au téléphone jusqu'à ce que je m'endorme, sans rien dire, juste là. Je n'ai jamais oublié. Il y a mille petits moments comme ça — des trajets en voiture à chanter trop fort, des fous rires dont personne ne comprend le sens, des silences qui valaient tous les discours. Merci d'être exactement toi, tout le temps. Je t'aime, bien plus que je ne te le montre.",sig:"Clara"}]},
 {n:1,type:"texte",q:"Un mot du cœur",text:"Ma plus belle réussite, ce sera toujours toi.",sig:"Maman",more:[{type:"vocal",q:"Mon souvenir de toi petite",dur:"0:44"},{type:"photo",q:"Une photo de nous que j'adore"}]},

 {n:5,type:"texte",q:"Pour toi",text:"Le monde est tellement plus doux avec toi dedans.",sig:"Manon",more:[{type:"texte",q:"Ce que je te souhaite",text:"Continue à voir le bon côté, même les jours gris.",sig:"Manon"}]},

function animateCount(el,to,dur,onTick){

function textScene(a,n,sp){const len=(a.text||'').trim().length,size=len<14?52:len<40?40:len<110?27:len<260?22:len<430?19:17;
  return `<div class="makick">Un mot pour toi</div><div class="maq">${a.q}</div>
  <div class="mtextwrap"><span class="mq1" style="color:${sp.acc}">“</span><div class="mtextbody" style="font-size:${size}px">${escD(a.text)}</div><span class="mq2" style="color:${sp.acc}">”</span><div class="msig">— ${a.sig||NAMES[n]}</div></div>
  <div class="mfoot">Des souvenirs qui restent</div>`;}
function photoScene(a){const pos=a.qpos==='bottom'?'bottom':'top';return `<div class="mphoto-q ${pos}"><div class="makick">Ton souvenir en image</div><div class="maq2">${a.q}</div></div>
  <div class="mfoot" style="color:#fff">Des souvenirs qui restent</div><div class="mheartf" style="color:#fff">${ICO_HEART}</div>`;}
let haloRAF=null;
function stopHalo(){if(haloRAF){cancelAnimationFrame(haloRAF);haloRAF=null;}}
function startDestHalo(){const raysG=document.getElementById('haloRays');if(!raysG)return;stopHalo();
  const core=document.getElementById('haloCore'),amb=document.getElementById('haloAmb');
  const cx=100,cy=100,ringR=54,M=60,rays=[],rlen=[],rph=[],rfr=[];
  for(let i=0;i<M;i++){const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('stroke-width',(1.4+Math.random()*1.1).toFixed(2));raysG.appendChild(ln);rays.push(ln);rlen.push(6+Math.random()*16);rph.push(Math.random()*6.283);rfr.push(0.8+Math.random()*1.1);}
  const t0=performance.now();let cur=0.1;
  function env(x){const s=Math.abs(Math.sin(x*3))*0.45+Math.abs(Math.sin(x*5.3+1.1))*0.3+Math.abs(Math.sin(x*8.1+0.5))*0.18;let g=Math.sin(x*0.8)+Math.sin(x*0.33+2.1);g=g>-0.4?1:0.12;return Math.max(0.05,Math.min(1,0.12+0.05*Math.sin(x*1.5)+s*g*0.74));}
  function frame(now){const t=(now-t0)/1000,target=env(t);cur+=(target-cur)*(target>cur?0.28:0.12);const a=cur;
    for(let i=0;i<M;i++){const ang=(i/M)*6.283,osc=Math.sin(t*2.2*rfr[i]+rph[i])*0.5+0.5,inner=ringR,len=rlen[i]*0.5+2+a*30+osc*(3+a*8);
      const x1=cx+Math.cos(ang)*inner,y1=cy+Math.sin(ang)*inner,x2=cx+Math.cos(ang)*(inner+len),y2=cy+Math.sin(ang)*(inner+len),ln=rays[i];
      ln.setAttribute('x1',x1.toFixed(1));ln.setAttribute('y1',y1.toFixed(1));ln.setAttribute('x2',x2.toFixed(1));ln.setAttribute('y2',y2.toFixed(1));ln.setAttribute('stroke-opacity',(0.22+a*0.62*(0.45+osc*0.55)).toFixed(3));}
    if(core){core.style.transform='scale('+(0.7+a*0.9).toFixed(3)+')';core.style.opacity=(0.35+a*0.5).toFixed(3);}
    if(amb){amb.style.opacity=(0.22+a*0.5).toFixed(3);}
    haloRAF=requestAnimationFrame(frame);}
  haloRAF=requestAnimationFrame(frame);}
const ICO_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
function miniW(){const h=[7,13,20,10,22,15,9,18,12,17,8,15,20,11,16,9,19,12,8,21];return h.map(x=>`<i style="height:${x}px"></i>`).join('');}
const DOCICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>';
function vpScene(a){return `<div class="mveil-top"></div><div class="mveil-bot"></div>
  <div class="mphoto-q top"><div class="makick">Un souvenir pour toi</div><div class="maq2">${a.q}</div></div>
  <div class="vpbar2"><button class="vp-mini">${ICO_PAUSE}</button><span>0:01</span><span class="track"><i></i></span><span>${a.dur||'0:00'}</span></div>${FOOT}`;}
function tpScene(a){return `<div class="mveil-top"></div>
  <div class="mphoto-q top"><div class="makick">Un mot pour toi</div><div class="maq2">${a.q}</div></div>
  <button class="tp-open" id="tpopen" onclick="tpToggle()">${DOCICON}<span>Lire son message</span><span class="tparr">↑</span></button>
  <div class="tp-panel" id="tppanel"><span class="tp-q">“</span><div class="tp-text">« ${escD(a.text)} »</div><div class="tp-heart">${ICO_HEART}</div><button class="btn tp-close" onclick="tpToggle()">Fermer</button></div>
  <div class="mfoot" style="color:#fff">Des souvenirs qui restent</div>`;}
function tpToggle(){const pn=document.getElementById('tppanel'),op=document.getElementById('tpopen');if(!pn)return;const open=pn.classList.toggle('open');if(op)op.style.opacity=open?'0':'1';}
function storyShell(a,n,bars,headRight){
  const hA=!!a.dur||a.type==='vocal',hT=!!a.text,hP=a.type==='photo'||!!a.photo;
  const sp=spalD(n);
  let cls,bg,scene,col;
  if(hA&&hP){cls='st-vp';bg=PHOTOBG;col='#fff';scene=vpScene(a);}
  else if(hT&&hP){cls='st-tp';bg=PHOTOBG;col='#fff';scene=tpScene(a);}
  else if(hA){cls='st-audio';bg=sp.bg;col=sp.ink;scene=haloScene(a,sp);}
  else if(hP){cls='st-photo';bg=PHOTOBG;col='#fff';scene=photoScene(a);}
  else{cls='st-text';bg=sp.bg;col=sp.ink;scene=textScene(a,n,sp);}
  const isPhotoBg=(cls==='st-photo'||cls==='st-vp'||cls==='st-tp');
  return `<div class="story ${cls}" id="story" style="background:${bg};color:${col}">
    <div class="ph"><div class="g" style="background:${bg};background-size:cover;background-position:center"></div></div>
    ${cls==='st-photo'?'<div class="veil"></div>':''}
    <div class="prog">${bars}</div>
    <div class="shead"><div class="ava" style="background:${grad(n)}">${initial(n)}</div><div class="nm">${NAMES[n]}</div>${headRight}</div>
    ${scene}`;}

function startReveal(){
  S.i=0;
  S.revList=C.map(m=>{const arr=souvenirsOf(m);const s=S.flow==="rescan"?arr[Math.floor(Math.random()*arr.length)]:arr[0];return {n:m.n,s};});
  go('reveal');
}
SCREENS.reveal=()=>{playCard(S.i);};

function storyInner(a,n){
  if(a.type==="vocal") return `<div class="kick">${a.q}</div><div class="voice"><div class="pl"><svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor"><path d="M2 2 L14 9 L2 16 Z"/></svg></div>${waveHTML(true)}<div class="t">${a.dur}</div></div>`;
  if(a.type==="photo") return `<div class="kick">${a.q}</div><div class="photocap">📷 Une photo rien que pour toi</div>`;
  return `<div class="kick">${a.q}</div><div class="note"><span class="quote">“</span>${a.text}<div class="sig">— ${a.sig||NAMES[n]}</div></div>`;
}
function playCard(idx){
  light(true);stopHalo();
  const it=S.revList[idx], n=it.n, a=it.s;
  const bars=S.revList.map((_,k)=>`<div class="p"><i data-k="${k}" style="width:${k<idx?'100%':'0'}"></i></div>`).join("");
  const headRight=S.flow==="rescan"?`<button class="skipst" onclick="go('biblio')">Passer ›</button>`:`<div class="x" onclick="go('fin')">✕</div>`;
  app.innerHTML=storyShell(a,n,bars,headRight)+`<div class="taps"><div class="l" onclick="prev()"></div><div class="r" onclick="next()"></div></div></div>`;
  startDestHalo();
  const fill=document.querySelector(`i[data-k="${idx}"]`);
  const DUR=a.type==="vocal"?3400:(a.type==="photo"?2800:Math.min(9000,3000+(a.text||'').length*7)); let start=performance.now();
  function frame(now){const p=Math.min(1,(now-start)/DUR);if(fill)fill.style.width=(p*100)+"%";if(p>=1){next();return;}raf=requestAnimationFrame(frame);}
  raf=requestAnimationFrame(frame);
}
function next(){if(raf)cancelAnimationFrame(raf);if(S.i<S.revList.length-1){S.i++;playCard(S.i);}else go(S.flow==="rescan"?"biblio":"fin");}
function prev(){if(raf)cancelAnimationFrame(raf);if(S.i>0){S.i--;playCard(S.i);}else playCard(0);}

SCREENS.fin=()=>{light(false);
  app.innerHTML=`<div class="view fade"><div class="glow"></div>${motesHTML()}
   <div class="center" style="position:relative;z-index:2">
     <div class="orn"><i></i><span>♥</span><i class="r"></i></div>
     <h1>Voilà ce que tu<br>représentes<br>pour <em>eux.</em></h1>
     <div class="sub">Et ce n'est que le début,<br>il te reste encore plein<br>de souvenirs à découvrir.</div>
     <div class="stack">
        <button class="btn gold" onclick="go('biblio')">Découvrir « Leurs mots »</button>
        <button class="btn line" onclick="startReveal()">Revoir</button>
     </div>
   </div></div>`;};

SCREENS.retour=()=>{light(false);
  app.innerHTML=`<div class="view fade"><div class="glow"></div>${motesHTML()}
   <div class="center" style="position:relative;z-index:2">
     <div class="logo-big" style="font-size:38px">Ravive</div><div class="logo-tl">Pour ne rien oublier de nous</div>
     <div class="orn"><i></i><span>♥</span><i class="r"></i></div>
     <h1 class="big">Bon retour.</h1>
     <div class="sub">Tes proches sont toujours là, quand tu en as besoin.</div>
     <div class="stack">
        <button class="btn gold" onclick="startReveal()">Revoir un souvenir de chacun</button>
        <button class="btn line" onclick="go('biblio')">Leurs mots</button>
     </div>
   </div></div>`;};

SCREENS.biblio=()=>{light(false);
  const cells=C.map(m=>{const cnt=souvenirsOf(m).length;
    return `<div class="person" onclick="openP(${m.n})">
      <div class="ava2" style="background:${grad(m.n)}">${m.selfie?'':`<span class="pinit">${initial(m.n)}</span>`}${cnt>1?`<div class="more">${cnt}</div>`:''}</div>
      <div class="pn">${NAMES[m.n]}</div></div>`;}).join("");
  app.innerHTML=`<div class="lib fade">
     <button class="backb" onclick="go(S.flow==='rescan'?'retour':'fin')">‹</button>
     <div class="libhead"><div class="t">Leurs mots <span class="heart">♥</span></div><div class="s">Retrouve ici tout ce qu'ils ont préparé pour toi.<br>Certains avaient encore beaucoup à te raconter…</div></div>
     <div class="grid">${cells}</div>
  </div>`;};

function openP(n){S.profil=n;S.pi=0;go('profil');}
SCREENS.profil=()=>{profCard(S.pi);};
function profCard(pi){
  light(true);stopHalo();
  const m=C.find(x=>x.n===S.profil), n=m.n, arr=souvenirsOf(m), a=arr[pi];
  const bars=arr.map((_,k)=>`<div class="p"><i style="width:${k<=pi?'100%':'0'}"></i></div>`).join("");
  app.innerHTML=storyShell(a,n,bars,`<div class="x" onclick="go('biblio')">✕</div>`)+`<div class="ptaps"><div class="pl" onclick="pprev()"></div><div class="pr" onclick="pnext()"></div></div></div>`;
  startDestHalo();
}
function pnext(){const arr=souvenirsOf(C.find(x=>x.n===S.profil));if(S.pi<arr.length-1){S.pi++;profCard(S.pi);}else go('biblio');}
function pprev(){if(S.pi>0){S.pi--;profCard(S.pi);}}

function setFlow(f){S.flow=f;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.flow===f));restart();}
function restart(){S.i=0;S.profil=null;go(S.flow==='first'?'scan':'retour');}
document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>setFlow(b.dataset.flow)));
document.getElementById('restart').addEventListener('click',restart);
restart();
</script>
</body>
</html>
