<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="240mm" viewBox="0 0 180 240">
  <title>Ravive - gabarit mosaïque 18x24 cm</title>
  <desc>Les rectangles avec id photo_XX sont les emplacements photo. La zone text_zone est réservée au texte.</desc>
  <style>
    .photo-slot { fill:#e8e4de; stroke:#ffffff; stroke-width:0.8; }
    .slot-label { font-family:Arial,sans-serif; font-size:4px; fill:#8b857d; text-anchor:middle; dominant-baseline:middle; }
    .text-zone { fill:#f7f1e8; stroke:#b8aa98; stroke-width:0.5; }
    .text-label { font-family:Georgia,serif; font-size:6px; fill:#6b5140; text-anchor:middle; dominant-baseline:middle; }
    .safe { fill:none; stroke:#d8cec1; stroke-width:0.3; stroke-dasharray:2 2; }
  </style>

  <rect id="photo_01" class="photo-slot" x="0.000" y="0.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="30.000" y="30.000">1</text>
  <rect id="photo_02" class="photo-slot" x="60.000" y="0.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="90.000" y="30.000">2</text>
  <rect id="photo_03" class="photo-slot" x="120.000" y="0.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="150.000" y="30.000">3</text>
  <rect id="photo_04" class="photo-slot" x="0.000" y="60.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="30.000" y="90.000">4</text>
  <rect id="photo_05" class="photo-slot" x="60.000" y="60.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="90.000" y="90.000">5</text>
  <rect id="photo_06" class="photo-slot" x="120.000" y="60.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="150.000" y="90.000">6</text>
  <rect id="photo_07" class="photo-slot" x="0.000" y="120.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="30.000" y="150.000">7</text>
  <rect id="photo_08" class="photo-slot" x="60.000" y="120.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="90.000" y="150.000">8</text>
  <rect id="photo_09" class="photo-slot" x="120.000" y="120.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="150.000" y="150.000">9</text>
  <rect id="photo_10" class="photo-slot" x="0.000" y="180.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="30.000" y="210.000">10</text>
  <rect id="photo_11" class="photo-slot" x="60.000" y="180.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="90.000" y="210.000">11</text>
  <rect id="photo_12" class="photo-slot" x="120.000" y="180.000" width="60.000" height="60.000"/>
  <text class="slot-label" x="150.000" y="210.000">12</text>
</svg>