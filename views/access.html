<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3EADB">
  <title>Ravive — Retrouver mon accès</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ravive.css">
</head>
<body>
  <div class="device"><div id="app" class="view">
    <div class="head"><span class="kicker">Lien perdu ?</span><h1>Retrouver l’accès<br>à mon cadeau</h1></div>
    <div class="body">
      <div class="sub" style="margin-bottom:18px">Indique l’adresse email utilisée lors de la commande. On t’envoie un nouveau lien, l’ancien ne fonctionnera plus.</div>
      <form id="f">
        <div class="field"><label for="email">Ton e-mail</label><input class="inp" id="email" type="email" required autocomplete="email" placeholder="prenom@email.com"></div>
        <p class="error" id="err"></p>
        <div class="stack"><button class="btn gold" id="send" type="submit">Recevoir mon lien <span class="arrow"></span></button></div>
      </form>
      <div class="note hidden" id="ok"><span class="em">📬</span><span>Si un projet correspond à cette adresse, un email vient de partir. Pense à vérifier tes courriers indésirables.</span></div>
    </div>
  </div></div>
  <script>window.RAVIVE_STATE = __STATE__;</script>
  <script src="/js/shared.js"></script>
  <script src="/js/access.js"></script>
</body>
</html>
